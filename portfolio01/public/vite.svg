<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="jglBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="jglText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="jglGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Gradient Border -->
  <rect x="14" y="14" width="228" height="228" rx="60" fill="url(#jglBorder)" filter="url(#jglGlow)" />

  <!-- Inner Dark Background -->
  <rect x="24" y="24" width="208" height="208" rx="50" fill="#0f1014" />

  <!-- JGL Monogram Text -->
  <text 
    x="128" 
    y="144" 
    text-anchor="middle" 
    dominant-baseline="central"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="92" 
    font-weight="900" 
    letter-spacing="-3"
    fill="url(#jglText)"
  >JGL</text>
</svg>